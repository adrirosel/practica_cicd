name: Granja Animales Node.js CI #1

on: #2
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs: #3
    build:
        runs-on: ubuntu-latest #4
        steps: #5
            - name: Checkout repository #6
                uses: actions/checkout@v7 #7
            - name: Use Node.js
                uses: actions/setup-node@v7 #8
                with:
                    node-version: '20'
            - name: Run Yarn #9
                run: yarn install
            - name: Run tests
                run: yarn test
